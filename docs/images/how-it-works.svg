    <text x="295" y="198" text-anchor="middle" font-size="13" fill="#65676b">location.pathname</text>
    <text x="295" y="245" text-anchor="middle" font-size="12" fill="#8a8d91">skips /groups, /watch, …</text>
  </g>

  <g>
