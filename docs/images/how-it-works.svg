      <path d="M0 0 L10 5 L0 10 z" fill="#65676b"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="399" rx="16" fill="#ffffff" stroke="#e4e6eb"/>

  <g fill="none" stroke="#65676b" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M170 180 H206"/>
    <path d="M380 165 C405 165 405 85 426 85"/>
    <path d="M380 195 C405 195 405 275 426 275"/>
    <path d="M630 85 C655 85 655 165 676 165"/>
    <path d="M630 275 C655 275 655 195 676 195"/>
    <path d="M775 220 V345 H95 V224" stroke-dasharray="5 5"/>
  </g>

  <g>
